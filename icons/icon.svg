<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tomatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60"/>
      <stop offset="100%" style="stop-color:#1e8449"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Tomato body -->
  <ellipse cx="256" cy="300" rx="160" ry="150" fill="url(#tomatoGrad)"/>

  <!-- Tomato highlight -->
  <ellipse cx="200" cy="260" rx="40" ry="30" fill="rgba(255,255,255,0.2)"/>

  <!-- Stem -->
  <rect x="246" y="140" width="20" height="40" rx="5" fill="#5d4e37"/>

  <!-- Leaves -->
  <path d="M256 160 Q200 140 180 100 Q220 120 256 130 Q292 120 332 100 Q312 140 256 160" fill="url(#leafGrad)"/>

  <!-- Timer circle -->
  <circle cx="256" cy="300" r="80" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="8"/>
  <path d="M256 220 A80 80 0 1 1 176 300" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/>

  <!-- Timer hands -->
  <line x1="256" y1="300" x2="256" y2="250" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="300" x2="290" y2="320" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="300" r="8" fill="white"/>
</svg>
