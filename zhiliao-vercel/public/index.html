<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知了青年 · 文创经营决策系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      color: #e8e8e8;
      min-height: 100vh;
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .title {
      font-size: 24px;
      font-weight: 600;
      background: linear-gradient(90deg, #d4af37 0%, #f4e4bc 50%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { font-size: 12px; color: rgba(212, 175, 55, 0.6); margin-top: 6px; }
    .refresh-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #d4af37 0%, #b8960c 100%);
      color: #1a1a2e;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .refresh-btn:hover { transform: scale(1.05); }
    .refresh-btn:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); cursor: not-allowed; }
    
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
    }
    .kpi-icon { position: absolute; top: 12px; right: 12px; font-size: 24px; opacity: 0.15; }
    .kpi-label { font-size: 11px; color: rgba(255,255,255,0.5); }
    .kpi-value { font-size: 24px; font-weight: 700; margin: 8px 0 4px; }
    .kpi-sub { font-size: 10px; color: rgba(255,255,255,0.4); }
    .kpi-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; }

    .charts-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 768px) {
      .charts-grid { grid-template-columns: 1fr; }
    }
    .chart-card {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .chart-title { font-size: 15px; margin-bottom: 16px; }
    
    .trend-chart {
      display: flex;
      height: 180px;
      align-items: flex-end;
      gap: 3px;
    }
    .trend-bar-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 20px;
    }
    .trend-bar {
      width: 100%;
      border-radius: 3px 3px 0 0;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .trend-bar:hover { opacity: 0.8; }
    .trend-label {
      margin-top: 4px;
      font-size: 8px;
      color: rgba(255,255,255,0.4);
      transform: rotate(-45deg);
      white-space: nowrap;
    }
    .legend { display: flex; gap: 16px; margin-top: 12px; font-size: 10px; color: rgba(255,255,255,0.5); }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }
    .product-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: rgba(0,0,0,0.2);
      border-radius: 6px;
    }
    .product-rank {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 700;
    }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-meta { font-size: 9px; color: rgba(255,255,255,0.4); margin-top: 2px; }
    .product-sales { font-size: 12px; color: #4ecdc4; font-weight: 600; }

    .table-card { margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { padding: 10px; text-align: left; color: rgba(255,255,255,0.5); border-bottom: 1px solid rgba(255,255,255,0.1); }
    th:not(:first-child) { text-align: right; }
    td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    td:not(:first-child) { text-align: right; }
    .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; }
    .progress-fill { height: 100%; background: #d4af37; border-radius: 3px; }

    .error-box {
      padding: 20px;
      margin-bottom: 24px;
      border-radius: 12px;
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.3);
    }
    .error-title { color: #ff6b6b; font-size: 14px; margin-bottom: 12px; }
    .error-msg { color: #ff6b6b; font-size: 13px; margin-bottom: 12px; }
    .error-list { font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.8; padding-left: 20px; }

    .loading { text-align: center; padding: 60px 20px; }
    .loading-icon { font-size: 48px; margin-bottom: 16px; }
    .loading-text { color: rgba(255,255,255,0.6); }

    .empty { text-align: center; padding: 60px 20px; }

    .footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.3);
    }
    .meta-info {
      margin-top: 24px;
      padding: 16px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="header">
      <div>
        <h1 class="title">知了青年 · 文创经营决策系统</h1>
        <p class="subtitle">数据源: 飞书多维表格 | <span id="update-time">加载中...</span></p>
      </div>
      <button class="refresh-btn" id="refresh-btn" onclick="loadData()">🔄 刷新数据</button>
    </header>

    <div id="error-container"></div>
    <div id="loading-container">
      <div class="loading">
        <div class="loading-icon">⏳</div>
        <p class="loading-text">正在连接飞书，获取数据...</p>
      </div>
    </div>
    <div id="content-container" style="display:none;"></div>
  </div>

  <script>
    // API地址（部署后自动使用相对路径）
    const API_URL = '/api/dashboard';

    // 加载数据
    async function loadData() {
      const btn = document.getElementById('refresh-btn');
      const loading = document.getElementById('loading-container');
      const content = document.getElementById('content-container');
      const errorBox = document.getElementById('error-container');

      btn.disabled = true;
      btn.textContent = '⏳ 加载中...';
      loading.style.display = 'block';
      content.style.display = 'none';
      errorBox.innerHTML = '';

      try {
        const res = await fetch(API_URL);
        const json = await res.json();

        if (!json.success) {
          throw new Error(json.error || '获取数据失败');
        }

        renderDashboard(json.data);
        document.getElementById('update-time').textContent = `更新于 ${new Date().toLocaleTimeString()}`;
        loading.style.display = 'none';
        content.style.display = 'block';

      } catch (err) {
        loading.style.display = 'none';
        errorBox.innerHTML = `
          <div class="error-box">
            <h3 class="error-title">❌ 连接飞书失败</h3>
            <p class="error-msg">${err.message}</p>
            <div>
              <p style="margin-bottom:8px;">🔧 请检查:</p>
              <ol class="error-list">
                <li>飞书应用是否已<strong>发布</strong></li>
                <li>应用是否有 bitable:record:read 权限</li>
                <li>多维表格是否已授权给该应用</li>
              </ol>
            </div>
          </div>
        `;
      } finally {
        btn.disabled = false;
        btn.textContent = '🔄 刷新数据';
      }
    }

    // 渲染Dashboard
    function renderDashboard(data) {
      const { summary, dailyData, productData, fields, meta } = data;
      const maxSales = Math.max(...dailyData.map(d => d.sales), 1);

      let html = `
        <!-- KPI卡片 -->
        <div class="kpi-grid">
          ${renderKPI('总销售额', formatMoney(summary.totalSales), `${summary.days}天数据`, '#d4af37', '💰')}
          ${renderKPI('总订单数', summary.totalOrders.toLocaleString(), `日均 ${Math.round(summary.totalOrders/summary.days)} 单`, '#4ecdc4', '📋')}
          ${renderKPI('客单价', `¥${summary.avgOrder.toFixed(1)}`, '订单均价', '#ff6b6b', '👤')}
          ${renderKPI('连带率', summary.bindRate.toFixed(2), '件/单', '#a29bfe', '🛒')}
          ${renderKPI('SKU数', summary.skuCount, '在售商品', '#74b9ff', '🎁')}
          ${renderKPI('销售件数', summary.totalQty.toLocaleString(), `均价 ¥${(summary.totalSales/summary.totalQty).toFixed(1)}`, '#fd79a8', '📦')}
        </div>

        <!-- 图表区域 -->
        <div class="charts-grid">
          <!-- 趋势图 -->
          <div class="chart-card">
            <h2 class="chart-title" style="color:#d4af37;">📈 每日销售趋势</h2>
            <div class="trend-chart">
              ${dailyData.slice(-30).map(d => {
                const height = (d.sales / maxSales) * 100;
                const isWeekend = [0, 6].includes(new Date(d.date).getDay());
                const color = isWeekend ? '#ff6b6b' : '#d4af37';
                return `
                  <div class="trend-bar-wrapper">
                    <div class="trend-bar" style="height:${Math.max(height, 2)}%;background:linear-gradient(180deg, ${color} 0%, ${color}66 100%);" title="${d.date}&#10;销售: ¥${d.sales.toLocaleString()}&#10;订单: ${d.orders}"></div>
                    <span class="trend-label">${d.date.slice(5)}</span>
                  </div>
                `;
              }).join('')}
            </div>
            <div class="legend">
              <span><span style="color:#d4af37;">●</span> 工作日</span>
              <span><span style="color:#ff6b6b;">●</span> 周末</span>
            </div>
          </div>

          <!-- TOP商品 -->
          <div class="chart-card">
            <h2 class="chart-title" style="color:#4ecdc4;">🏆 TOP10 商品</h2>
            <div class="product-list">
              ${productData.slice(0, 10).map((p, i) => `
                <div class="product-item">
                  <span class="product-rank" style="background:${i===0?'#d4af37':i===1?'#c0c0c0':i===2?'#cd7f32':'rgba(255,255,255,0.1)'};color:${i<3?'#1a1a2e':'#fff'};">${i+1}</span>
                  <div class="product-info">
                    <div class="product-name">${p.name || p.sku}</div>
                    <div class="product-meta">${p.qty}件 · ¥${p.price}/件</div>
                  </div>
                  <span class="product-sales">¥${p.sales >= 1000 ? (p.sales/1000).toFixed(1)+'k' : p.sales.toFixed(0)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <!-- 数据明细表 -->
        <div class="chart-card table-card">
          <h2 class="chart-title" style="color:#74b9ff;">📊 每日数据明细</h2>
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>日期</th>
                  <th>销售额</th>
                  <th>订单数</th>
                  <th>件数</th>
                  <th>客单价</th>
                  <th style="text-align:center;">趋势</th>
                </tr>
              </thead>
              <tbody>
                ${dailyData.slice(-14).reverse().map(d => `
                  <tr>
                    <td style="color:#fff;">${d.date}</td>
                    <td style="color:#d4af37;font-weight:600;">¥${d.sales.toLocaleString()}</td>
                    <td style="color:#4ecdc4;">${d.orders}</td>
                    <td style="color:#a29bfe;">${d.qty}</td>
                    <td style="color:#ff6b6b;">¥${d.avgOrder.toFixed(1)}</td>
                    <td>
                      <div class="progress-bar">
                        <div class="progress-fill" style="width:${(d.sales/maxSales)*100}%;"></div>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <!-- 元信息 -->
        <div class="meta-info">
          <p>📋 检测到的字段: ${fields.join(', ')}</p>
          <p style="margin-top:4px;">📊 原始记录数: ${meta?.totalRecords || '未知'} 条 | 生成时间: ${meta?.generatedAt || '-'}</p>
        </div>

        <footer class="footer">
          知了青年 · 文脉数字化创新中心 | Wenmai OS
        </footer>
      `;

      document.getElementById('content-container').innerHTML = html;
    }

    // 渲染KPI卡片
    function renderKPI(label, value, sub, color, icon) {
      return `
        <div class="kpi-card">
          <span class="kpi-icon">${icon}</span>
          <p class="kpi-label">${label}</p>
          <p class="kpi-value" style="color:${color};">${value}</p>
          <p class="kpi-sub">${sub}</p>
          <div class="kpi-bar" style="background:linear-gradient(90deg, ${color} 0%, transparent 100%);"></div>
        </div>
      `;
    }

    // 格式化金额
    function formatMoney(amount) {
      if (amount >= 10000) return `¥${(amount/10000).toFixed(2)}万`;
      return `¥${amount.toFixed(0)}`;
    }

    // 页面加载时获取数据
    loadData();
  </script>
</body>
</html>
